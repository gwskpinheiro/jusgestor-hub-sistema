{# Campo de formulário padronizado (RNF01): rótulo, indicação de obrigatório e erros. #}
<div class="campo{% if campo.errors %} campo--erro{% endif %}">
  <label for="{{ campo.id_for_label }}">
    {{ campo.label }}{% if campo.field.required %} <span class="obrigatorio" aria-hidden="true">*</span><span class="sr-only">(obrigatório)</span>{% endif %}
  </label>
  {{ campo }}
  {% if campo.help_text %}<div class="campo__ajuda">{{ campo.help_text|safe }}</div>{% endif %}
  {% for erro in campo.errors %}<p class="campo__mensagem">{{ erro }}</p>{% endfor %}
</div>
